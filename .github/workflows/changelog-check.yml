name: Changelog check

# Guard che rende DETERMINISTICO il versioning: una PR verso main che pubblica una
# release (label release:major|minor|patch) deve aggiornare changelog.json (voce in
# testa) con un numero coerente con `ultimo_tag + label`, e package.json/pyproject.toml
# devono combaciare. Read-only: non scrive nel repo.
#
# Senza label release:* la PR NON è considerata una release: il check emette solo un
# warning e salta la validazione (niente fail → niente email di notifica). La label
# viene tipicamente aggiunta subito dopo l'apertura della PR: l'evento `labeled`
# rilancia il check con enforcement pieno.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release label
        id: label
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          kinds=$(echo "$LABELS" | jq -r '.[] | select(startswith("release:")) | sub("release:"; "")')
          count=$(printf '%s\n' "$kinds" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            # Nessuna label release:* ⇒ la PR non pubblica una release. Non è un errore:
            # solo un warning (niente fail → niente email). La validazione viene saltata;
            # appena viene aggiunta la label, l'evento `labeled` rilancia con enforcement pieno.
            echo "::warning::Nessuna label release:major|minor|patch sulla PR — validazione changelog saltata. Aggiungi la label per pubblicare una release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::La PR deve avere esattamente una label release:major|minor|patch (trovate: '${kinds//$'\n'/, }')."
            exit 1
          fi
          echo "kind=$kinds" >> "$GITHUB_OUTPUT"

      - name: Latest released tag
        id: tag
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "tag=${tag:-v0.0.0}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate changelog & versions
        if: steps.label.outputs.skip != 'true'
        run: node .github/scripts/changelog.mjs check "${{ steps.tag.outputs.tag }}" "${{ steps.label.outputs.kind }}"
